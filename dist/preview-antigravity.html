<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antigravity Agent Trajectory · Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090a0d;
    color: #adbac7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .preview-wrapper {
    width: 100%;
    max-width: 580px;
    background: #0c0d10;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }

  .window-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: #111216;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .window-dots {
    display: flex;
    gap: 7px;
  }
  .window-dots span {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .dot--red { background: #ff5f56; }
  .dot--yellow { background: #ffbd2e; }
  .dot--green { background: #27c93f; }

  .window-title {
    font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color: #768390;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Trajectory Container */
  .agent-trajectory {
    padding: 22px 24px;
    font-size: 13.5px;
    line-height: 1.8;
  }

  .agent-step {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    padding: 3px 0;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .agent-step.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .agent-step--header {
    color: #e6edf3;
    font-weight: 500;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: 8px;
  }
  .agent-step--header .step-file {
    color: #ffffff;
    font-weight: 600;
  }
  .agent-step--header .step-caret {
    color: #6e7681;
    font-size: 11px;
    margin-left: 3px;
  }

  .step-text { color: #adbac7; }
  .step-cmd { color: #e6edf3; font-weight: 500; }
  .step-shield {
    display: inline-flex;
    align-items: center;
    color: #768390;
    margin: 0 1px;
  }
  .step-shield svg {
    width: 13.5px;
    height: 13.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .step-chevron {
    color: #545d68;
    font-size: 13px;
    line-height: 1;
  }
  .step-exit {
    color: #768390;
    font-size: 12px;
  }

  .agent-step--thought {
    color: #768390;
    font-style: italic;
    font-size: 12.5px;
  }

  /* Antigravity Badges */
  .badge-code {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    line-height: 1.3;
  }
  .badge-code--js {
    background: rgba(245, 158, 11, 0.18);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.35);
  }
  .badge-code--tag {
    background: rgba(249, 115, 22, 0.18);
    color: #fb923c;
    border: 1px solid rgba(249, 115, 22, 0.35);
  }

  .step-lines {
    color: #768390;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }

  /* Line Diff numbers (+2 green, -2 red) */
  .diff-add {
    color: #3fb950;
    font-weight: 700;
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    margin-left: 4px;
  }
  .diff-del {
    color: #f85149;
    font-weight: 700;
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    margin-left: 2px;
  }

  /* Working Glowing Shimmer Effect */
  .agent-step--working {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(255, 255, 255, 0.06);
  }
  .working-pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .working-dot {
    width: 7.5px;
    height: 7.5px;
    border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 10px #3fb950, 0 0 22px rgba(63, 185, 80, 0.6);
    animation: pulseWorking 1.3s ease-in-out infinite alternate;
  }
  .working-text {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, #6e7681 0%, #adbac7 25%, #ffffff 50%, #adbac7 75%, #6e7681 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmerWave 2.2s linear infinite;
  }

  @keyframes shimmerWave {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  @keyframes pulseWorking {
    from { transform: scale(0.8); opacity: 0.5; }
    to { transform: scale(1.25); opacity: 1; }
  }

  /* Action Bar */
  .control-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
  }
  .btn-replay {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(168, 85, 247, 0.15);
    border: 1px solid rgba(168, 85, 247, 0.4);
    color: #c084fc;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-replay:hover {
    background: rgba(168, 85, 247, 0.25);
    border-color: rgba(168, 85, 247, 0.6);
    transform: translateY(-1px);
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
  }
</style>
</head>
<body>

<div class="preview-wrapper">
  <div class="window-top">
    <div class="window-dots">
      <span class="dot--red"></span>
      <span class="dot--yellow"></span>
      <span class="dot--green"></span>
    </div>
    <span class="window-title">Antigravity · Agent Trajectory</span>
    <span style="width: 44px"></span>
  </div>

  <div class="agent-trajectory" id="trajectory">
    <div class="agent-step agent-step--header">
      <span class="step-text">Editing <span class="step-file">index.html</span></span>
      <span class="step-caret">⌵</span>
    </div>
    <div class="agent-step">
      <span class="step-text">Ran <span class="step-cmd">list all buttons in index.html</span></span>
      <span class="step-shield"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
      <span class="step-chevron">›</span>
    </div>
    <div class="agent-step agent-step--thought">
      <span class="step-text">Thought for 8s</span>
      <span class="step-chevron">›</span>
    </div>
    <div class="agent-step">
      <span class="step-text">Ran <span class="step-cmd">find all href=#oferta</span></span>
      <span class="step-shield"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
      <span class="step-exit">· Exited with code 1</span>
      <span class="step-chevron">›</span>
    </div>
    <div class="agent-step">
      <span class="step-text">Created <span class="badge-code badge-code--js">JS</span> <span class="step-file">find_oferta.js</span></span>
    </div>
    <div class="agent-step">
      <span class="step-text">Ran <span class="step-cmd">run find_oferta.js</span></span>
      <span class="step-shield"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
      <span class="step-chevron">›</span>
    </div>
    <div class="agent-step agent-step--thought">
      <span class="step-text">Thought for 7s</span>
      <span class="step-chevron">›</span>
    </div>
    <div class="agent-step">
      <span class="step-text">Analyzed <span class="badge-code badge-code--tag">&lt;/&gt;</span> <span class="step-file">index.html</span> <span class="step-lines">#L48-68</span></span>
    </div>
    <div class="agent-step">
      <span class="step-text">Edited <span class="badge-code badge-code--tag">&lt;/&gt;</span> <span class="step-file">index.html</span> <span class="diff-add">+2</span> <span class="diff-del">-2</span></span>
    </div>
    <div class="agent-step agent-step--working">
      <span class="working-pill">
        <span class="working-dot"></span>
        <span class="working-text">Working</span>
      </span>
    </div>
  </div>
</div>

<div class="control-bar">
  <button class="btn-replay" onclick="animateTrajectory()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Repetir Animação
  </button>
</div>

<script>
  function animateTrajectory() {
    const steps = document.querySelectorAll('.agent-step');
    steps.forEach(s => s.classList.remove('is-visible'));
    steps.forEach((step, idx) => {
      setTimeout(() => {
        step.classList.add('is-visible');
      }, idx * 100);
    });
  }
  window.addEventListener('DOMContentLoaded', animateTrajectory);
</script>

</body>
</html>
